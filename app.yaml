# Google App Engine Configuration for LEVEL 23 Legal AI Suite
runtime: nodejs20
instance_class: F2

env_variables:
  NODE_ENV: 'production'

automatic_scaling:
  min_instances: 0
  max_instances: 5
  target_cpu_utilization: 0.65

handlers:
  # Static assets routing
  - url: /assets
    static_dir: dist/assets
    secure: always

  # PWA Manifest and Icons
  - url: /(manifest\.webmanifest|manifest\.json|sw\.js|icon\.svg|favicon\.ico)
    static_files: dist/\1
    upload: dist/(manifest\.webmanifest|manifest\.json|sw\.js|icon\.svg|favicon\.ico)
    secure: always

  # Catch-all to Express / Node backend
  - url: /.*
    script: auto
    secure: always
