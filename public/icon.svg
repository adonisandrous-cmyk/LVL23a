<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#02050e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae093" />
      <stop offset="50%" stop-color="#dfb76c" />
      <stop offset="100%" stop-color="#b38627" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Icon Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.75" />

  <!-- Shield Inner Border -->
  <path d="M256 64 C350 64 416 110 416 224 C416 348 296 424 256 448 C216 424 96 348 96 224 C96 110 162 64 256 64 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.3" />

  <!-- Scales of Justice & Phoenix Wings Emblem -->
  <g transform="translate(0, 10)" filter="url(#goldGlow)">
    <!-- Central Pillar / Sword of Justice -->
    <path d="M256 120 L256 360" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    <!-- Pillar Cap -->
    <circle cx="256" cy="110" r="16" fill="url(#goldGrad)" />
    <!-- Beam -->
    <path d="M150 180 Q256 150 362 180" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    
    <!-- Left Scale Bowl -->
    <path d="M150 180 L120 250 M150 180 L180 250" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M110 250 Q150 280 190 250 Z" fill="url(#goldGrad)" opacity="0.85" />
    
    <!-- Right Scale Bowl -->
    <path d="M362 180 L332 250 M362 180 L392 250" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M322 250 Q362 280 402 250 Z" fill="url(#goldGrad)" opacity="0.85" />

    <!-- Level 23 Geometric Accent -->
    <path d="M220 380 L292 380 L280 395 L232 395 Z" fill="url(#goldGrad)" />
    <path d="M200 395 L312 395 L300 410 L212 410 Z" fill="url(#goldGrad)" />
  </g>

  <!-- High-Tech Circuit Nodes -->
  <circle cx="256" cy="180" r="8" fill="url(#tealGrad)" />
  <circle cx="150" cy="180" r="6" fill="url(#tealGrad)" />
  <circle cx="362" cy="180" r="6" fill="url(#tealGrad)" />
  <line x1="256" y1="180" x2="256" y2="290" stroke="url(#tealGrad)" stroke-width="3" stroke-dasharray="4,4" />

  <!-- L23 Monogram at base -->
  <text x="256" y="462" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-weight="900" font-size="34" fill="url(#goldGrad)" letter-spacing="6">LEVEL 23</text>
</svg>
